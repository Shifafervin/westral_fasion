<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Inter", sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f3f3f3;
}

.card{
    width:380px;
    background:#fff;
    padding:35px;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
    text-align:center;
}

.icon{
    width:60px;
    height:60px;
    background:#eee;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 15px;
    font-size:24px;
    color:#6B4F3B;
}

.title{
    font-size:20px;
    font-weight:600;
}

.subtitle{
    font-size:13px;
    color:#777;
    margin:10px 0 25px;
    line-height:1.5;
}

label{
    display:block;
    text-align:left;
    font-size:11px;
    color:#777;
    margin-bottom:5px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:6px;
    margin-bottom:20px;
    outline:none;
}

.btn{
    width:100%;
    padding:13px;
    background:#6B4F3B;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:500;
}

.back{
    margin-top:20px;
    font-size:13px;
}

.back a{
    text-decoration:none;
    color:#6B4F3B;
}

/* 🔥 MESSAGE STYLE */
.alert{
    padding:10px;
    margin-bottom:15px;
    border-radius:6px;
    font-size:12px;
}

.alert.error{
    background:#ffe5e5;
    color:#b30000;
}

.alert.success{
    background:#e5ffe5;
    color:#1a7f37;
}
</style>
</head>

<body>

<div class="card">

    <div class="icon">🔒</div>

    <div class="title">Forgot password?</div>
    <div class="subtitle">
        Enter your email address and we'll send you a 6-digit code.
    </div>

    <!-- 🔥 FORM FIXED -->
    <form method="POST" action="{% url 'user_details:profile_forgotpassword' %}">
        {% csrf_token %}

        <!-- 🔥 SHOW MESSAGES -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert {{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <label>EMAIL ADDRESS</label>
        <input type="email" name="email" required>

        <button type="submit" class="btn">Send OTP</button>
    </form>

    <div class="back">
        ← <a href="{% url 'login' %}">Back to Login</a>
    </div>

</div>

</body>
</html>
