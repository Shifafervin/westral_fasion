{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Change Password</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Inter", sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(to right, #f4f4f4, #e9ded4);
}

/* CARD */
.card{
    width:380px;
    background:#fff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

/* TITLE */
.title{
    text-align:center;
    font-weight:600;
    font-size:18px;
}

.subtitle{
    text-align:center;
    font-size:12px;
    color:#777;
    margin:8px 0 25px;
}

/* LABEL */
label{
    font-size:11px;
    color:#777;
    display:block;
    margin-bottom:5px;
    margin-top:12px;
}

/* INPUT */
input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:6px;
    outline:none;
}

/* ERROR TEXT */
.error{
    font-size:11px;
    color:#a94442;
    margin-top:5px;
}

/* FORGOT */
.forgot{
    text-align:right;
    font-size:12px;
    margin:10px 0 20px;
}

.forgot a{
    text-decoration:none;
    color:#6B4F3B;
}

/* BUTTON */
.btn{
    width:100%;
    padding:13px;
    background:#6B4F3B;
    color:white;
    border:none;
    border-radius:6px;
    font-weight:500;
    cursor:pointer;
}

/* BACK BUTTON */
.back-btn{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:1px solid #6B4F3B;
    background:white;
    border-radius:6px;
    cursor:pointer;
}

.back-btn a{
    text-decoration:none;
    color:#6B4F3B;
}
</style>

</head>
<body>

<div class="card">

    <div class="title">Change Password</div>
    <div class="subtitle">Secure your account with new credentials</div>

    <!-- 🔥 FORM START -->
    <form method="POST" action="{% url 'user_details:change_password' %}">
        {% csrf_token %}

        <!-- CURRENT PASSWORD -->
        <label>CURRENT PASSWORD</label>
        <input type="password" name="current_password" placeholder="••••••••" required>

        <!-- NEW PASSWORD -->
        <label>NEW PASSWORD</label>
        <input type="password" name="new_password" placeholder="••••••••" required>

        <!-- CONFIRM -->
        <label>CONFIRM NEW PASSWORD</label>
        <input type="password" name="confirm_password" placeholder="••••••••" required>

        <!-- 🔥 ERROR MESSAGES (DYNAMIC) -->
       {% if messages %}

    {% for message in messages %}

        {% if 'password' in message.tags %}

            <div class="error">
                {{ message }}
            </div>

        {% endif %}

    {% endfor %}

{% endif %}
        <!-- FORGOT PASSWORD -->
        <div class="forgot">
            <a href="{% url 'user_details:profile_forgotpassword' %}">Forgot Password?</a>
        </div>

        <!-- SAVE -->
        <button type="submit" class="btn">Save Changes</button>

        <!-- BACK -->
        <button type="button" class="back-btn">
            <a href="{% url 'user_details:profile' %}">Back to Profile</a>
        </button>

    </form>
    <!-- 🔥 FORM END -->

</div>

</body>
</html>
