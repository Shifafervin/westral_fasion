<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Inter", sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f4f4;
}

/* CARD */
.card{
    width:360px;
    background:#fff;
    padding:40px 35px;
    border-radius:14px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

/* ICON */
.icon{
    width:50px;
    height:50px;
    margin:0 auto 15px;
    background:#f1edea;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

/* TITLE */
.title{
    font-size:20px;
    font-weight:600;
    margin-bottom:8px;
}

.subtitle{
    font-size:13px;
    color:#777;
    margin-bottom:25px;
    line-height:1.5;
}

/* LABEL */
label{
    display:block;
    text-align:left;
    font-size:11px;
    color:#777;
    margin-bottom:6px;
}

/* INPUT BOX */
.input-box{
    position:relative;
    margin-bottom:18px;
}

.input-box input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:6px;
    outline:none;
}

/* EYE ICON */
.eye{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:14px;
}

/* BUTTON */
.btn{
    width:100%;
    padding:13px;
    margin-top:10px;
    background:#5a3b2e;
    color:white;
    border:none;
    border-radius:6px;
    font-weight:600;
    cursor:pointer;
}

/* FOOTER TEXT */
.footer{
    margin-top:20px;
    font-size:11px;
    color:#aaa;
}

/* ERROR MESSAGE */
.error{
    color:red;
    font-size:12px;
    margin-bottom:10px;
}
</style>
</head>

<body>

<div class="card">

    <div class="icon">🔒</div>

    <div class="title">Reset password</div>
    <div class="subtitle">
        Create a new secure password for your account. 
        Make sure it's strong and unique.
    </div>

    <!-- 🔥 DJANGO FORM -->
    <form method="POST">
        {% csrf_token %}

        {% if messages %}
            {% for message in messages %}
                <div class="error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <label>NEW PASSWORD</label>
        <div class="input-box">
            <input type="password" name="password" id="password" required>
            <span class="eye" onclick="togglePassword('password')">👁</span>
        </div>

        <label>CONFIRM PASSWORD</label>
        <div class="input-box">
            <input type="password" name="confirm_password" id="confirm_password" required>
            <span class="eye" onclick="togglePassword('confirm_password')">👁</span>
        </div>

        <button class="btn">SAVE PASSWORD</button>
    </form>

    <div class="footer">
        🔐 Your password is encrypted and secure.
    </div>

</div>

<script>
function togglePassword(id){
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
