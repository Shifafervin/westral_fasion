<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Verify Email</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* CARD */
.card {
    width: 360px;
    background: white;
    padding: 35px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

/* ICON */
.icon {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #f1edea;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px;
    font-size: 20px;
}

/* TEXT */
.title {
    font-size: 20px;
    font-weight: bold;
}

.subtitle {
    font-size: 13px;
    color: #777;
    margin: 8px 0 20px;
}

/* OTP BOX */
.otp-container {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 15px;
}

.otp-container input {
    width: 42px;
    height: 48px;
    border: 1px solid #ddd;
    border-radius: 6px;
    text-align: center;
    font-size: 18px;
}

/* TIMER */
.timer {
    font-size: 12px;
    color: #888;
    margin-bottom: 15px;
}

/* BUTTON */
.btn {
    width: 100%;
    padding: 12px;
    background: #6b4a36;
    color: white;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

/* LINKS */
.links {
    margin-top: 15px;
    font-size: 12px;
    color: #777;
}

.links a {
    color: #6b4a36;
    text-decoration: none;
    font-weight: bold;
    cursor: pointer;
}

</style>
</head>

<body>

<div class="card">

    <div class="icon">✉️</div>

    <div class="title">Verify your email</div>
    <div class="subtitle">
        Enter the 6-digit code sent to your email address.
    </div>

    <form method="POST" action="{% url 'user_details:profileverify_otp' %}">
    {% csrf_token %}
        <div class="otp-container">
            <input type="text" name="otp1" maxlength="1">
            <input type="text" name="otp2" maxlength="1">
            <input type="text" name="otp3" maxlength="1">
            <input type="text" name="otp4" maxlength="1">
            <input type="text" name="otp5" maxlength="1">
            <input type="text" name="otp6" maxlength="1">
        </div>

        <div class="timer" id="timer">Code expires in 01:00</div>

        <button type="submit" class="btn">Verify Email</button>
    </form>

    <div class="links">
        Didn’t receive code? <a href="{% url 'user_details:profile_resend_otp' %}">Resend</a><br><br>
        <a href="#">Change email address</a>
    </div>

</div>

<script>
/* AUTO FOCUS OTP */
const inputs = document.querySelectorAll(".otp-container input");

inputs.forEach((input, index) => {
    input.addEventListener("input", () => {
        if (input.value && index < inputs.length - 1) {
            inputs[index + 1].focus();
        }
    });
});

/* 1 MIN TIMER */
let time = 60;
const timerEl = document.getElementById("timer");

const interval = setInterval(() => {
    let seconds = time;

    timerEl.innerText = "Code expires in 00:" + (seconds < 10 ? "0" : "") + seconds;

    if (time <= 0) {
        clearInterval(interval);
        timerEl.innerText = "Code expired";
    }

    time--;
}, 1000);
</script>

</body>
</html>
