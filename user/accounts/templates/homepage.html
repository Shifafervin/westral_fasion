<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | Westral Fashion</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
}

.container {
    display: flex;
    height: 100vh;
}

/* LEFT */
.left {
    width: 50%;
    position: relative;
}

.left img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.brand {
    position: absolute;
    top: 20px;
    left: 20px;
    color: white;
    font-weight: bold;
}

.bottom-text {
    position: absolute;
    bottom: 20px;
    left: 20px;
    color: white;
}

.bottom-text h1 {
    margin: 0;
    font-size: 32px;
}

/* RIGHT */
.right {
    width: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.form-box {
    width: 360px;
}

/* TEXT */
.title {
    font-size: 22px;
    font-weight: bold;
}

.subtitle {
    font-size: 13px;
    color: gray;
    margin-bottom: 25px;
}

/* LABEL */
label {
    font-size: 11px;
    color: #666;
    display: block;
    margin-top: 15px;
}

/* INPUT */
.input-box {
    position: relative;
}

input {
    width: 100%;
    padding: 14px;
    border: none;
    background: #eaeaea;
    border-radius: 6px;
    margin-top: 5px;
}

/* ROW */
.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.forgot {
    font-size: 11px;
    color: #6B4F3B;
    text-decoration: none;
}

/* EYE ICON */
.eye {
    position: absolute;
    right: 10px;
    top: 40px;
    cursor: pointer;
}

/* CHECKBOX */
.remember {
    margin: 15px 0;
    font-size: 13px;
}

/* BUTTON */
.login-btn {
    width: 100%;
    padding: 14px;
    border-radius: 25px;
    border: none;
    background: linear-gradient(to right, #6B4F3B, #523826);
    color: white;
    font-weight: bold;
    cursor: pointer;
}

/* DIVIDER */
.divider {
    text-align: center;
    margin: 25px 0;
    font-size: 11px;
    color: gray;
}

/* GOOGLE BUTTON */
.google-btn {
    width: 100%;
    padding: 12px;
    border-radius: 25px;
    border: 1px solid #ddd;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    cursor: pointer;
}

/* FOOTER */
.footer {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
}

.footer a {
    color: #6B4F3B;
    font-weight: bold;
    text-decoration: none;
}

</style>
</head>

<body>

<div class="container">

<!-- LEFT -->
<div class="left">
    <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCDhGRLuwP0tj1R7zBoyKpop4CTzSiGIeGQbGwAPEFFWrd6N64hFMW6_8tuF_l9hSDgNvnYCIdN2mv8B52FNsFFDMb_39Xjl7AVTEERm_zmUCTxyIQoeQ-DHc17qvyEMCQEV_MFtxYyozFT_HLwaNDmbWaCoDFSYOvhXZ0ljwhv7MPHY9SciAxfEKNchlLFMRVIrye_DKEDDG-ft5xMNqn4QAdOGywtZfIE3DN7IU6kiLPCWXlVCEomS-kQA8Z2ThMELCN9WtxxdMU">
    
    <div class="brand">WESTRAL FASHION</div>

    <div class="bottom-text">
        <h1>STEP INTO YOUR STYLE</h1>
        <p>Premium fashion designed for comfort</p>
    </div>
</div>

<!-- RIGHT -->
<div class="right">
<div class="form-box">

    <div class="title">OWN YOUR STYLE</div>
    <div class="subtitle">Enter your details to access your account</div>

    <form method="POST">
        {% csrf_token %}

        <label>EMAIL ADDRESS</label>
        <input type="email" name="email" placeholder="name@example.com">

        <div class="row">
            <label>PASSWORD</label>
            <a href="#" class="forgot">FORGOT PASSWORD?</a>
        </div>

        <div class="input-box">
            <input type="password" id="password" placeholder="••••••••">
            <span class="eye" onclick="togglePassword()">👁</span>
        </div>

        <div class="remember">
            <input type="checkbox"> Remember me
        </div>

        <button class="login-btn">LOGIN</button>
    </form>

    <div class="divider">OR CONTINUE WITH</div>

    <button class="google-btn">
        <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.4 0 6.4 1.2 8.7 3.1l6.5-6.5C35.4 2.5 30.1 0 24 0"/>
            <path fill="#34A853" d="M46.5 24.5H24v9.3h12.7"/>
            <path fill="#FBBC05" d="M10.3 28.9c-.6-1.8-.6-3.6 0-5.4"/>
            <path fill="#4285F4" d="M24 48c6.5 0 12-2.1 16-5.7"/>
        </svg>
        Google
    </button>

    <div class="footer">
        Not a member? <a href="#">Join us</a>
    </div>

</div>
</div>

</div>

<script>
function togglePassword() {
    let pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
