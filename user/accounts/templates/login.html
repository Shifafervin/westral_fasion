<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
}

.container {
    display: flex;
    height: 100vh;
}

/* LEFT SIDE */
.left {
    width: 50%;
    position: relative;
}

.left img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.brand {
    position: absolute;
    top: 20px;
    left: 20px;
    color: white;
    font-weight: bold;
}

.bottom-text {
    position: absolute;
    bottom: 20px;
    left: 20px;
    color: white;
}

.bottom-text h1 {
    margin: 0;
    font-size: 32px;
}

.bottom-text p {
    font-size: 14px;
}

/* RIGHT SIDE */
.right {
    width: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.form-box {
    width: 380px;
}

/* TEXT */
.title {
    font-size: 24px;
    font-weight: bold;
}

.subtitle {
    font-size: 14px;
    color: gray;
    margin-bottom: 25px;
}

/* LABEL */
label {
    font-size: 11px;
    color: #777;
    display: block;
    margin-top: 15px;
}

/* INPUT */
.input-box {
    position: relative;
}

input {
    width: 100%;
    padding: 14px;
    border: none;
    background: #eaeaea;
    border-radius: 6px;
    margin-top: 5px;
}

/* PASSWORD ROW */
.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.forgot {
    font-size: 12px;
    color: #5a3b2e;
    text-decoration: none;
}

/* EYE ICON */
.eye {
    position: absolute;
    right: 12px;
    top: 42px;
    cursor: pointer;
}

/* CHECKBOX */
.remember {
    margin: 15px 0;
    font-size: 13px;
}

/* BUTTON */
.login-btn {
    width: 100%;
    padding: 14px;
    border-radius: 25px;
    border: none;
    background: linear-gradient(to right, #5a3b2e, #7b4f36);
    color: white;
    font-weight: bold;
    cursor: pointer;
}

/* DIVIDER */
.divider {
    text-align: center;
    margin: 25px 0;
    font-size: 12px;
    color: gray;
}

/* GOOGLE BUTTON */
.google-btn {
    width: 100%;
    padding: 12px;
    border-radius: 25px;
    border: 1px solid #ddd;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    cursor: pointer;
}

/* FOOTER */
.footer {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
}

.footer a {
    color: #5a3b2e;
    font-weight: bold;
    text-decoration: none;
}

</style>
</head>

<body>

<div class="container">

<!-- LEFT -->
<div class="left">
    <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDE5pdZBI2btoeDj6jW0jEyILtiQvwwmaBO-SLksOhignzEGZ3VqO_l9BU05roTzfnARrDwtXyoj9RpflSj7u76gaM11sUzMiz3Qi5C8egbiZaxckvstUYxFLMFGDZBRFovNF6F8GcsFpKcJgvhCOFSoWIGD7mF5yfpIhensjG1KnCl1QUm2IO7_CjOZHNLETCDvnMhpQddZQni7N7cipw96nBqLMAwQU3aoelSjn7rVJis_KswpYji58rLfZ0EGJXhatfB0ktz7Os">
    
    <div class="brand">WESTRAL FASHION</div>

    <div class="bottom-text">
        <h1>STEP INTO YOUR STYLE</h1>
        <p>Premium fashion designed for comfort and performance.</p>
    </div>
</div>

<!-- RIGHT -->
<div class="right">
<div class="form-box">

    <div class="title">OWN YOUR STYLE</div>
    <div class="subtitle">Enter your details to access your account</div>

    <form method="POST">
        {% csrf_token %}

        <label>EMAIL ADDRESS</label>
        <input type="email" name="email" placeholder="name@example.com">

        <div class="row">
            <label>PASSWORD</label>
            <a href="#" class="forgot">FORGOT PASSWORD?</a>
        </div>

        <!-- PASSWORD WITH EYE ICON -->
        <div class="input-box">
            <input type="password" id="password" placeholder="••••••••">
            <span class="eye" onclick="togglePassword()">
                👁
            </span>
        </div>

        <div class="remember">
            <input type="checkbox"> Remember me
        </div>

        <button class="login-btn">LOGIN</button>
    </form>

    <div class="divider">OR CONTINUE WITH</div>

    <!-- GOOGLE BUTTON -->
    <button class="google-btn">
        <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.4 0 6.4 1.2 8.7 3.1l6.5-6.5C35.4 2.5 30.1 0 24 0 14.7 0 6.6 5.4 2.7 13.3l7.6 5.9C12.3 13.2 17.7 9.5 24 9.5z"/>
            <path fill="#34A853" d="M46.5 24.5c0-1.7-.1-3.3-.4-4.9H24v9.3h12.7c-.5 2.9-2.1 5.4-4.4 7.1l6.8 5.3c4-3.7 6.4-9.2 6.4-16.8z"/>
            <path fill="#FBBC05" d="M10.3 28.9c-.6-1.8-1-3.6-1-5.4s.4-3.7 1-5.4l-7.6-5.9C1 15.5 0 19.6 0 23.5s1 8 2.7 11.3l7.6-5.9z"/>
            <path fill="#4285F4" d="M24 48c6.5 0 12-2.1 16-5.7l-6.8-5.3c-2 1.3-4.5 2-9.2 2-6.3 0-11.7-4.2-13.6-9.8l-7.6 5.9C6.6 42.6 14.7 48 24 48z"/>
        </svg>
        Google
    </button>

    <div class="footer">
        Not a member? <a href="#">Join us</a>
    </div>

</div>
</div>

</div>

<script>
function togglePassword() {
    let pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
