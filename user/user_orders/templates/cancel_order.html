{% extends 'base.html' %}
{% load static %}

{% block title %}
Cancel Order
{% endblock %}

{% block extra_css %}

<style>

/* ================= OVERLAY ================= */

.cancel-overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,0.45);

    display:flex;

    justify-content:center;

    align-items:center;

    z-index:9999;

    padding:20px;
}

/* ================= MODAL ================= */

.cancel-modal{

    width:100%;

    max-width:480px;

    background:white;

    border-radius:18px;

    padding:38px;

    box-shadow:0 20px 50px rgba(0,0,0,0.15);

    animation:popup 0.25s ease;
}

@keyframes popup{

    from{
        transform:scale(0.92);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

/* ================= TITLE ================= */

.cancel-title{

    font-size:30px;

    font-weight:800;

    color:#2f241e;

    line-height:1.3;

    margin-bottom:18px;

    text-transform:uppercase;
}

/* ================= SUB ================= */

.cancel-sub{

    font-size:11px;

    letter-spacing:2px;

    color:#9b8d83;

    margin-bottom:16px;

    font-weight:700;
}

/* ================= TEXTAREA ================= */

.reason-box{

    width:100%;

    height:130px;

    border:1px solid #ddd;

    border-radius:10px;

    padding:16px;

    resize:none;

    outline:none;

    font-size:13px;

    font-family:inherit;

    transition:0.2s;
}

.reason-box:focus{

    border-color:#6B4F3B;
}

/* ================= BUTTONS ================= */

.button-group{

    display:flex;

    gap:14px;

    margin-top:28px;
}

.cancel-btn{

    flex:1;

    height:52px;

    border:none;

    border-radius:10px;

    font-size:12px;

    font-weight:800;

    letter-spacing:1px;

    cursor:pointer;

    transition:0.2s;
}

/* CONFIRM */

.confirm-btn{

    background:#6B4F3B;

    color:white;
}

.confirm-btn:hover{

    background:#563c2c;
}

/* KEEP */

.keep-btn{

    background:white;

    border:1px solid #d8ccc2;

    color:#6B4F3B;

    text-decoration:none;

    display:flex;

    justify-content:center;

    align-items:center;
}

.keep-btn:hover{

    background:#f3efeb;
}

/* ================= RESPONSIVE ================= */

@media(max-width:600px){

    .cancel-modal{

        padding:28px 22px;
    }

    .cancel-title{

        font-size:24px;
    }

    .button-group{

        flex-direction:column;
    }
}

</style>

{% endblock %}

{% block content %}

<div class="cancel-overlay">

    <div class="cancel-modal">

        <div class="cancel-title">

            Are You Sure You Want To
            Cancel This Order?

        </div>

        <div class="cancel-sub">

            WHAT IS THE REASON?

        </div>

        <form method="POST">

            {% csrf_token %}

            <textarea
            name="cancel_reason"
            class="reason-box"
            placeholder="Write your reason (max 150 words)"
            ></textarea>

            <div class="button-group">

                <button
                type="submit"
                class="cancel-btn confirm-btn"
                >

                    YES, CANCEL ORDER

                </button>

                <a
                href="{% url 'order_detail' order.order_id %}"
                class="cancel-btn keep-btn"
                >

                    KEEP ORDER

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
