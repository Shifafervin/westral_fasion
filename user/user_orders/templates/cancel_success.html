
{% extends 'base.html' %}
{% load static %}

{% block title %}
Order Cancelled
{% endblock %}

{% block extra_css %}
<!-- Load Google Material Symbols for interface checkmark -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

/* ================= THEME VARIABLES ================= */
:root {
    --primary-color: #341818; /* Elegant deep brown from shop */
    --primary-hover: #4e2b2b;
    --bg-light: #faf6f0;      /* Warm boutique cream background */
    --card-bg: #ffffff;
    --text-main: #341818;     /* Dark charcoal brown */
    --text-muted: #8e8076;    /* Warm beige-gray */
    --border-color: #efeae4;  /* Thin soft border */
    --font-serif: 'Playfair Display', 'Noto Serif', serif;
    --font-sans: 'Plus Jakarta Sans', sans-serif;
    --shadow-sm: 0 4px 24px rgba(139, 119, 101, 0.04);
    --shadow-md: 0 10px 30px rgba(139, 119, 101, 0.08);
    --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Force body styling to match screenshot background */
body {
    background-color: var(--bg-light) !important;
    color: var(--text-main);
    font-family: var(--font-sans);
    margin: 0;
}

/* ================= OVERLAY WITH BLUR BACKDROP ================= */
.cancel-success-overlay {
    position: fixed;
    inset: 0;
    background: rgba(52, 24, 24, 0.45);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    padding: 20px;
    backdrop-filter: blur(4px);
    box-sizing: border-box;
}

.cancel-success-overlay *, 
.cancel-success-overlay *::before, 
.cancel-success-overlay *::after {
    box-sizing: border-box;
}

/* ================= MODAL WITH BOUNCE TRANSITION ================= */
@keyframes popupBounce {
    0% {
        transform: scale(0.92);
        opacity: 0;
    }
    100% {
        transform: scale(1);
        opacity: 1;
    }
}

.cancel-success-modal {
    width: 100%;
    max-width: 520px;
    background: var(--card-bg);
    border-radius: 20px;
    padding: 55px 45px;
    text-align: center;
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-md);
    animation: popupBounce 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

/* ================= ICON INNER WRAPPERS ================= */
.success-icon-wrapper {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: #fbf9f6;
    border: 1px solid var(--border-color);
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 28px;
}

.success-icon {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--primary-color);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.success-icon span {
    font-size: 24px;
    font-weight: 500;
}

/* ================= TITLE & TEXTS ================= */
.success-title {
    font-family: var(--font-serif);
    font-size: 32px;
    font-weight: 500;
    color: var(--primary-color);
    margin-bottom: 16px;
    letter-spacing: -0.5px;
}

.success-text {
    font-size: 14.5px;
    line-height: 1.8;
    color: var(--text-muted);
    margin-bottom: 38px;
}

/* ================= BUTTONS ================= */
.button-group {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.success-btn {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 10px;
    background: var(--primary-color);
    color: #ffffff;
    text-decoration: none;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1.5px;
    transition: var(--transition);
    cursor: pointer;
    text-transform: uppercase;
}

.success-btn:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(52, 24, 24, 0.2);
}

.secondary-btn {
    background: #ffffff;
    border: 1px solid #dfd5cb;
    color: var(--primary-color);
}

.secondary-btn:hover {
    background: var(--bg-light);
    border-color: var(--primary-color);
}

/* ================= RESPONSIVE ================= */
@media(max-width:600px){
    .cancel-success-modal {
        padding: 40px 24px;
    }

    .success-title {
        font-size: 28px;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="cancel-success-overlay">

    <div class="cancel-success-modal">

        <!-- STATUS CHECK ICON -->
        <div class="success-icon-wrapper">
            <div class="success-icon">
                <span class="material-symbols-outlined">check</span>
            </div>
        </div>

        <!-- DETAILS CARD CONTENTS -->
        <h2 class="success-title">
            Order cancelled successfully
        </h2>

        <p class="success-text">
            Your cancellation request has been processed successfully.
        </p>

        <!-- ACTION BUTTON LINKS -->
        <div class="button-group">
            <a href="{% url 'wallet_page' %}" class="success-btn">
                Go to Wallet
            </a>
            
            <a href="{% url 'shop' %}" class="success-btn secondary-btn">
                Back to Shopping
            </a>
        </div>

    </div>

</div>
{% endblock %}
